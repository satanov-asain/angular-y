<div class="list">

  <div
    class="city-list"
    *ngFor="let city of cityList"
    (click)="chooseCity(city)"
  >
    {{city}}
  </div>

</div>

<div class="list">

  <div
    class="street-list"
    *ngFor="let street of streetList"
    (click)="chooseStreet(street)"
  >
    {{street}}
  </div>

</div>
